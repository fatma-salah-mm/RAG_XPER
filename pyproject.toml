[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-xper"
version = "2.0.0"
description = "Enterprise Multi-Modal RAG Pipeline with Qdrant and Modular Chunking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.7.2",
    "ollama>=0.3.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
ocr-easy = ["easyocr>=1.7.1"]
ocr-paddle = ["paddleocr>=2.7.3", "paddlepaddle>=2.6.1"]
ui = ["gradio>=4.36.0"]
redis = ["redis>=5.0.0"]
all = [
    "easyocr>=1.7.1",
    "gradio>=4.36.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
rag-xper = "rag_xper.cli.main:main"
rag-xper-api = "rag_xper.api.app:run_api"
rag-xper-ui = "rag_xper.ui.gradio_app:run_ui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "B905", "B007", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src/rag_xper"]
omit = ["*/ui/gradio_app.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65
