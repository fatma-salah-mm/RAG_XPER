[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-xper"
version = "2.0.0"
description = "Enterprise Multi-Modal RAG Pipeline with Qdrant and Modular Chunking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.7.2",
    "ollama>=0.3.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
ocr-easy = ["easyocr>=1.7.1"]
ocr-paddle = ["paddleocr>=2.7.3", "paddlepaddle>=2.6.1"]
ui = ["gradio>=4.36.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
all = [
    "easyocr>=1.7.1",
    "gradio>=4.36.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
rag-xper = "rag_xper.cli.main:main"
rag-xper-api = "rag_xper.api.app:run_api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
