name: RAG_XPER CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: "dummy-ci-api-key-for-testing"
      LLM_PROVIDER: "gemini"
      VECTOR_STORE_TYPE: "qdrant"
      QDRANT_STORAGE_PATH: "./storage/qdrant_db"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Libraries for OCR and PyMuPDF
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"

    - name: Run Pytest Suite
      run: |
        pytest
