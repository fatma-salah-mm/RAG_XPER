name: RAG_XPER CI



on:

  push:

    branches: [main]

  pull_request:

    branches: [main]



jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - name: Install uv

        uses: astral-sh/setup-uv@v5

        with:

          python-version: "3.11"

          enable-cache: true



      - name: Install dependencies

        run: uv sync --frozen --group dev



      - name: Ruff lint

        run: uv run ruff check src tests



  test:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version: ["3.10", "3.11", "3.12"]



    env:

      GEMINI_API_KEY: "dummy-ci-api-key-for-testing"

      LLM_PROVIDER: "gemini"

      VECTOR_STORE_TYPE: "qdrant"

      QDRANT_STORAGE_PATH: "./storage/qdrant_db"



    steps:

      - uses: actions/checkout@v4



      - name: Install uv

        uses: astral-sh/setup-uv@v5

        with:

          python-version: ${{ matrix.python-version }}

          enable-cache: true



      - name: Install system libraries for OCR and PyMuPDF

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0



      - name: Install Python dependencies

        run: uv sync --extra all --frozen --group dev



      - name: Run pytest with coverage gate

        run: uv run pytest --cov=rag_xper --cov-report=term-missing --cov-fail-under=65



  security:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - name: Install uv

        uses: astral-sh/setup-uv@v5

        with:

          python-version: "3.11"

          enable-cache: true



      - name: Install dependencies

        run: uv sync --frozen --group dev



      - name: Bandit security scan

        run: uv run bandit -r src/rag_xper -ll



      - name: Dependency audit
        run: uv run pip-audit --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815



  docker:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - name: Build Docker image

        run: docker build -f docker/Dockerfile -t rag-xper:ci .


