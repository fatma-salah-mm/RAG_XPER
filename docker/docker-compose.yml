# Dev / single-node stack: Qdrant + API (SQLite fallback, in-memory jobs)
#
# Secrets: copy docker/.env.example → docker/.env
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up --build -d

version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag_xper_qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_xper_api
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      LLM_PROVIDER: gemini
      VECTOR_STORE_TYPE: qdrant
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: rag_xper_documents
      REQUIRE_AUTH: "true"
      METRICS_REQUIRE_AUTH: "true"
      DOCS_ENABLED: "false"
      RATE_LIMIT_PER_MINUTE: "30"
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      LOG_FORMAT: json
      DOCUMENTS_DIR: /app/data/documents
    volumes:
      - ../data/documents:/app/data/documents:ro
      - app_storage:/app/storage

volumes:
  qdrant_storage:
  app_storage:
