version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_xper_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  redis:
    image: redis:7-alpine
    container_name: rag_xper_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_xper_api
    restart: unless-stopped
    depends_on:
      - qdrant
      - redis
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VECTOR_STORE_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=rag_xper_documents
      - REDIS_URL=redis://redis:6379
      - API_KEYS=${API_KEYS}
      - DOCUMENTS_DIR=/app/data/documents
    volumes:
      # Stage PDFs on the host here, then index them with POST /v1/ingest/folder.
      - ../data/documents:/app/data/documents:ro
      - app_storage:/app/storage

volumes:
  qdrant_storage:
  app_storage:
